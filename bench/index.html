<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Wingtale database preview</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:#111;background:#fff}
header{padding:16px 20px 8px;max-width:1100px;margin:0 auto}
header h1{font-size:22px;margin:0 0 4px}
header p{margin:0;color:#666;font-size:14px}
#map{height:42vh;min-height:260px;max-width:1100px;margin:8px auto 0;border-radius:12px}
.wrap{max-width:1100px;margin:0 auto;padding:12px 20px 60px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
select,input{font:inherit;font-size:14px;padding:9px 10px;border:1px solid #cfcfcf;border-radius:10px;background:#fff;min-height:42px}
input{flex:1;min-width:180px}
.count{font-size:13px;color:#666;margin:4px 0 10px}
.row{border-top:1px solid #eee;padding:14px 2px;cursor:pointer}
.row:hover{background:#fafafa}
.row h3{margin:0 0 4px;font-size:16px;line-height:1.35}
.meta{font-size:13px;color:#666;display:flex;flex-wrap:wrap;gap:4px 12px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:#f2f2f2;color:#333}
.fatal{background:#fde3d8;color:#8a2c00}
dialog{max-width:720px;width:calc(100% - 24px);border:0;border-radius:16px;padding:0}
dialog::backdrop{background:rgba(0,0,0,.4)}
.d{padding:22px}
.d h2{margin:0 0 8px;font-size:20px;line-height:1.3}
.d p{line-height:1.6}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin:12px 0}
.facts b{color:#666;font-weight:500}
.lesson{background:#f6f6f3;border-radius:10px;padding:12px 14px;font-size:15px}
details{margin-top:14px}
summary{cursor:pointer;font-weight:600}
pre{white-space:pre-wrap;font-family:inherit;font-size:14px;line-height:1.55;color:#333}
.close{position:sticky;top:0;float:right;margin:10px;border:1px solid #ddd;background:#fff;border-radius:999px;width:40px;height:40px;cursor:pointer}
a{color:#0b57d0}
</style>
</head>
<body>
<header><h1>Accident database preview</h1><p>Benchmark, 100 NTSB cases. Short text generated from the official report, original report text below each entry.</p></header>
<div id="map"></div>
<div class="wrap">
<div class="filters">
<input id="q" placeholder="Search aircraft, place, keyword" aria-label="Search">
<select id="fTheme" aria-label="Theme"><option value="">All themes</option></select>
<select id="fCause" aria-label="Cause"><option value="">All causes</option></select>
<select id="fInj" aria-label="Injuries"><option value="">All outcomes</option></select>
<select id="fPhase" aria-label="Phase"><option value="">All phases</option></select>
</div>
<div class="count" id="count"></div>
<div id="list"></div>
</div>
<dialog id="dlg"><button class="close" aria-label="Close" onclick="dlg.close()">✕</button><div class="d" id="det"></div></dialog>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const L_=x=>String(x||'').replace(/_/g,' ');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let data=[],markers={};
const map=L.map('map',{scrollWheelZoom:false}).setView([39,-97],4);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:12,attribution:'© OpenStreetMap'}).addTo(map);
const layer=L.layerGroup().addTo(map);
function fill(id,key){const s=document.getElementById(id);[...new Set(data.map(d=>d[key]).filter(Boolean))].sort().forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=L_(v);s.appendChild(o)})}
function render(){
 const q=document.getElementById('q').value.toLowerCase(),t=fTheme.value,c=fCause.value,i=fInj.value,p=fPhase.value;
 const rows=data.filter(d=>(!t||d.primary_theme==t)&&(!c||d.cause==c)&&(!i||d.injury==i)&&(!p||d.phase==p)&&(!q||(d.headline+' '+d.aircraft+' '+d.place+' '+d.summary).toLowerCase().includes(q)));
 document.getElementById('count').textContent=rows.length+' cases';
 const list=document.getElementById('list');list.innerHTML='';layer.clearLayers();
 rows.forEach(d=>{
  const r=document.createElement('div');r.className='row';r.tabIndex=0;
  r.innerHTML=`<h3>${esc(d.headline)}</h3><div class="meta"><span>${esc(d.date)}</span><span>${esc(d.place)}</span><span>${esc(d.aircraft)}</span><span class="tag ${d.injury=='fatal'?'fatal':''}">${esc(d.injury)}</span><span class="tag">${esc(L_(d.primary_theme))}</span></div>`;
  r.onclick=()=>open_(d);r.onkeydown=e=>{if(e.key=='Enter')open_(d)};list.appendChild(r);
  if(d.lat!=null){const m=L.circleMarker([d.lat,d.lng],{radius:6,color:d.injury=='fatal'?'#d9480f':'#1f4e9e',weight:2,fillOpacity:.6}).bindTooltip(d.headline);m.on('click',()=>open_(d));layer.addLayer(m)}
 });
}
function open_(d){
 det.innerHTML=`<h2>${esc(d.headline)}</h2><p>${esc(d.summary)}</p>
 <div class="facts"><b>Date</b><span>${esc(d.date)}</span><b>Place</b><span>${esc(d.place)}</span><b>Aircraft</b><span>${esc(d.aircraft)} (${esc(d.registration)})</span><b>Category</b><span>${esc(d.category)}</span><b>Phase</b><span>${esc(L_(d.phase))}</span><b>Outcome</b><span>${esc(d.injury)}${d.fatalities?', '+d.fatalities+' fatal':''}</span><b>Weather</b><span>${esc(d.weather||'')}</span><b>Pilot age</b><span>${esc(d.pilot_age||'')}</span><b>NTSB number</b><span>${esc(d.ntsb_no)}</span></div>
 <div class="lesson"><b>Takeaway</b> ${esc(d.lesson)}</div>
 <details><summary>Probable cause (NTSB)</summary><p>${esc(d.probable_cause)}</p></details>
 <details><summary>Original report text</summary><pre>${esc(d.raw_text)}</pre></details>
 <p style="font-size:13px;color:#666">Source National Transportation Safety Board, report ${esc(d.ntsb_no)}. Text in the original report section is public domain.</p>`;
 dlg.showModal();
}
fetch('cases.json').then(r=>r.json()).then(j=>{data=j;['fTheme:primary_theme','fCause:cause','fInj:injury','fPhase:phase'].forEach(x=>fill(...x.split(':')));render()});
['q','fTheme','fCause','fInj','fPhase'].forEach(id=>document.getElementById(id).addEventListener('input',render));
</script>
</body>
</html>
